<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>桂林山水风景图片</title>

    <style>
        /* 页面整体样式 */
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: "宋体", Arial, sans-serif;
        }

        /* 三级标题样式 */
        h3 {
            color: red;
            font-size: 22px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        /* 图片列表 */
        ul {
            list-style: none;
            padding: 0;
            margin: 0 auto;

            /* 图片水平排列 */
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* 列表项样式 */
        li {
            width: 100px;
            text-align: center;
        }

        /* 图片样式 */
        li img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        /* 超链接样式 */
        li a {
            display: block;
            margin-top: 5px;
            color: blue;
            font-size: 16px;
            text-decoration: underline;
        }

        /* 鼠标悬停效果 */
        li a:hover {
            color: red;
        }
    </style>
</head>

<body>

    <h3>桂林山水风景图片</h3>

    <ul>
        <li>
            <img src="images/1.jpg" alt="桂林山水1">
            <a href="https://www.baidu.com" target="_blank">
                桂林山水1
            </a>
        </li>

        <li>
            <img src="images/2.jpg" alt="桂林山水2">
            <a href="https://www.baidu.com" target="_blank">
                桂林山水2
            </a>
        </li>

        <li>
            <img src="images/3.jpg" alt="桂林山水3">
            <a href="https://www.baidu.com" target="_blank">
                桂林山水3
            </a>
        </li>

        <li>
            <img src="images/4.jpg" alt="桂林山水4">
            <a href="https://www.baidu.com" target="_blank">
                桂林山水4
            </a>
        </li>
    </ul>

</body>

</html>
