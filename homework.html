<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>天安门</title>

    <style>
        /* 整个网页 */
        body {
            background-color: #fffef0;
            margin: 15px;
            font-family: "宋体", SimSun, serif;
        }

        /* 标题 */
        h2 {
            text-align: center;
            font-family: "黑体", SimHei, sans-serif;
            color: #000000;
            font-size: 22px;

            /* 去掉标题默认过大的上下间距 */
            margin: 0;
            padding-bottom: 10px;

            /* 水平分割线：红色、2px粗 */
            border-bottom: 2px solid #ff6666;
        }

        /* 图片所在区域 */
        .image-box {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        /* 图片 */
        .image-box img {
            width: 420px;
            height: 270px;
            object-fit: cover;
        }

        /* 正文 */
        p {
            font-family: "宋体", SimSun, serif;
            font-size: 18px;
            color: #222222;

            /* 首行缩进两个汉字 */
            text-indent: 2em;

            /* 行间距 */
            line-height: 1.6;

            margin: 0;
        }
    </style>
</head>

<body>

    <!-- 居中标题 -->
    <h2>天安门</h2>

    <!-- 居中图片 -->
    <div class="image-box">
        <img src="https://cn.bing.com/images/search?view=detailV2&ccid=%2bY1M86Zy&id=3C98E9D062A4A8CACE2D69741CC247707DD7F82E&thid=OIP.-Y1M86ZyyH_7qxg-3X1CrAHaEv&mediaurl=https%3a%2f%2fpic4.zhimg.com%2fv2-d9938898f775915519d178f0154d1aff_r.jpg&exph=3915&expw=6122&q=%e5%a4%a9%e5%ae%89%e9%97%a81+%e5%9b%be%e7%89%87&mode=overlay&FORM=IQFRBA&ck=D64873ADC05277F8BC8B72C7BCF7FD22&selectedIndex=0&idpp=serp" alt="天安门">
    </div>

    <!-- 正文 -->
    <p>
        天安门，坐落在中华人民共和国首都北京市的中心、故宫的南端，
        与天安门广场以及人民英雄纪念碑、毛主席纪念堂、人民大会堂、
        中国国家博物馆隔长安街相望，占地面积4800平方米，
        以杰出的建筑艺术和特殊的政治地位为世人所瞩目。
    </p>

</body>

</html>
