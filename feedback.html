<!doctype HTML>
<head xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
    <meta charset="utf-8">
    <title>Feedback</title>
    <link rel="stylesheet" href="css/util.css">
    <link rel="stylesheet" href="css/feedback.css">
    <script src="js/jquery-4.0.0.js" type="text/javascript" defer></script>
    <script src="js/util.js" type="text/javascript" defer></script>
    <script src="js/feedback.js" type="text/javascript" defer></script>
</head>
<body>
    <header>
        <h1>Your Feedback</h1>
    </header>
    <main>
        <aside>
            <nav>
                <ul>
                    <li><a href="index.html">Home page</a></li>
                    <li><a onclick="goToPrevPage()" alt="previous page">Previous Page</a></li>
                    <li><a onclick="goToNextPage()" alt="next page">Next Page</a></li>
                </ul>
            </nav>
        </aside>
        <section>
            <article>
                <form class="feedback_form">
                    <fieldset class="sex">
                        <legend>Select your sex</legend>
                        <select id="sex">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                        <label for="sex"></label>
                    </fieldset>

                    <fieldset class="message">
                        <legend>Enter your feedback message</legend>
                        <textarea id="content" name="message" rows=20 cols=50 required>Message</textarea>
                        <label for="content"></label>
                    </fieldset>

                    <fieldset class="file">
                        <legend>Upload your proof materials (optional)</legend>
                        <input type="file" id="file">
                    </fieldset>

                    <input type="button" id="submit_button" onclick="submitFeedback()" value="Submit" />
                </form>
            </article>
        </section>
        <hr />
        <footer>
            <p>© 2026 Jin-Yi-Liang all rights reserved</p>
        </footer>
    </main>
</body>
